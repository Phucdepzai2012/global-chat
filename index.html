<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL CHAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #d6e2e9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container { width: 100%; max-width: 480px; height: 100vh; max-height: 750px; background: #ebf0f4; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
        
        /* Header Group Chat Zalo style */
        .chat-header { background: #0088ff; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0077e6; }
        .group-title { font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }
        .admin-status { background: #ff4d4f; color: white; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

        /* Profile Bar (Chỗ cài đặt Tên & Avatar) */
        .profile-bar { background: #fff; padding: 10px 12px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 8px; align-items: center; }
        .profile-bar input { flex: 1; border: 1px solid #ccc; padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none; }
        .profile-bar button { background: #0088ff; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        /* Chat Messages */
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #eef2f5; }
        .msg-row { display: flex; gap: 8px; align-items: flex-start; max-width: 85%; }
        .msg-row.my-msg { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #bbb; flex-shrink: 0; }
        
        .msg-content { display: flex; flex-direction: column; }
        .msg-sender { font-size: 11px; color: #555; margin-bottom: 2px; margin-left: 2px; font-weight: 600; }
        .my-msg .msg-sender { text-align: right; margin-right: 2px; }
        
        .msg-bubble { padding: 9px 13px; border-radius: 12px; font-size: 14px; word-break: break-word; background: white; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .my-msg .msg-bubble { background: #e5efff; color: #000; border: 1px solid #cce0ff; }
        
        .msg-footer { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
        .msg-time { font-size: 10px; color: #888; }
        .my-msg .msg-footer { justify-content: flex-end; }

        .delete-btn { background: none; border: none; color: #ff4d4f; cursor: pointer; font-size: 11px; font-weight: bold; }
        .delete-btn:hover { text-decoration: underline; }

        /* Input Area */
        .chat-input { padding: 10px; background: white; display: flex; gap: 8px; border-top: 1px solid #e0e0e0; align-items: center; }
        .chat-input input { flex: 1; border: 1px solid #ccc; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-input button { background: #0088ff; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header của Group Chat -->
    <div class="chat-header">
        <div class="group-title">GLOBAL CHAT</div>
        <div id="admin-tag" class="admin-status" style="display: none;">QUẢN TRỊ VIÊN</div>
    </div>

    <!-- Thanh nhập Tên & Đổi ảnh đại diện -->
    <div class="profile-bar">
        <input type="text" id="user-name-input" placeholder="Nhập tên riêng của bạn...">
        <input type="text" id="user-avatar-input" placeholder="URL Ảnh đại diện...">
        <button onclick="saveProfile()">Lưu</button>
    </div>

    <!-- Khung tin nhắn -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- Thanh gửi tin nhắn -->
    <div class="chat-input">
        <input type="text" id="msg-input" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<!-- Firebase Realtime Database SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // 1. CẤU HÌNH FIREBASE REALTIME DATABASE
    // Thay link Database của bạn vào đây
    const firebaseConfig = {
        databaseURL: "https://YOUR_DATABASE_NAME.firebaseio.com"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. TẠO MÃ TÊN VÀ AVATAR NGẪU NHIÊN RIÊNG BIỆT CHO MỖI NGƯỜI
    const randomId = Math.floor(1000 + Math.random() * 9000); // Tạo số ngẫu nhiên 4 chữ số (VD: 4829)
    
    let currentUser = {
        name: localStorage.getItem('chat_name') || ('Thành viên #' + randomId),
        avatar: localStorage.getItem('chat_avatar') || ('https://api.dicebear.com/7.x/bottts/svg?seed=' + randomId)
    };

    // Đưa thông tin hiện tại vào thanh profile
    document.getElementById('user-name-input').value = currentUser.name;
    document.getElementById('user-avatar-input').value = currentUser.avatar;

    function checkAdminStatus() {
        const adminTag = document.getElementById('admin-tag');
        if (currentUser.name.trim() === 'PHUCRAM') {
            adminTag.style.display = 'block';
        } else {
            adminTag.style.display = 'none';
        }
    }
    checkAdminStatus();

    // 3. LƯU PROFILE KHI ĐỔI TÊN/AVATAR
    function saveProfile() {
        const inputName = document.getElementById('user-name-input').value.trim();
        const inputAvatar = document.getElementById('user-avatar-input').value.trim();

        if (inputName) currentUser.name = inputName;
        if (inputAvatar) currentUser.avatar = inputAvatar;

        localStorage.setItem('chat_name', currentUser.name);
        localStorage.setItem('chat_avatar', currentUser.avatar);

        checkAdminStatus();
        alert('Đã đổi thông tin thành công!');
        location.reload();
    }

    // 4. GỬI TIN NHẮN
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        const messageData = {
            sender: currentUser.name,
            avatar: currentUser.avatar,
            text: text,
            timestamp: Date.now()
        };

        db.ref('messages').push(messageData);
        input.value = '';
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // 5. XÓA TIN NHẮN (CHỈ KHI TÊN LÀ "PHUCRAM")
    function deleteMessage(key) {
        if (currentUser.name.trim() === 'PHUCRAM') {
            if (confirm('Xác nhận xóa tin nhắn này?')) {
                db.ref('messages/' + key).remove();
            }
        }
    }

    // 6. LẮNG NGHE VÀ ĐỒNG BỘ TIN NHẮN THỜI GIAN THỰC
    const messagesRef = db.ref('messages');
    messagesRef.on('value', (snapshot) => {
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        
        const data = snapshot.val();
        if (!data) return;

        const isAdmin = (currentUser.name.trim() === 'PHUCRAM');

        Object.keys(data).forEach((key) => {
            const msg = data[key];
            const isMe = (msg.sender === currentUser.name);
            
            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgRow = document.createElement('div');
            msgRow.className = `msg-row ${isMe ? 'my-msg' : ''}`;

            msgRow.innerHTML = `
                <img class="msg-avatar" src="${msg.avatar}" alt="Avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback'">
                <div class="msg-content">
                    <div class="msg-sender">${msg.sender}</div>
                    <div class="msg-bubble">${msg.text}</div>
                    <div class="msg-footer">
                        <span class="msg-time">${timeStr}</span>
                        ${isAdmin ? `<button class="delete-btn" onclick="deleteMessage('${key}')">Xóa</button>` : ''}
                    </div>
                </div>
            `;

            container.appendChild(msgRow);
        });

        // Cuộn xuống cuối khung chat
        container.scrollTop = container.scrollHeight;
    });
</script>
</body>
</html>
