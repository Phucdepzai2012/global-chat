<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container { width: 100%; max-width: 480px; height: 100vh; max-height: 700px; background: #fff; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Header */
        .chat-header { background: #0088ff; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ccc; border: 2px solid white; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; font-size: 15px; }
        .admin-badge { background: #ff4d4f; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; width: fit-content; margin-top: 2px; }
        
        /* Messages Area */
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #eef2f5; }
        .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 80%; }
        .msg-row.my-msg { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        
        .msg-content { display: flex; flex-direction: column; }
        .msg-sender { font-size: 11px; color: #666; margin-bottom: 2px; margin-left: 4px; }
        .my-msg .msg-sender { text-align: right; margin-right: 4px; }
        
        .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; word-break: break-word; position: relative; background: white; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .my-msg .msg-bubble { background: #0088ff; color: white; }
        
        .msg-time { font-size: 10px; color: #999; margin-top: 2px; align-self: flex-end; }
        .my-msg .msg-time { color: rgba(255,255,255,0.8); }

        .delete-btn { background: none; border: none; color: #ff4d4f; cursor: pointer; font-size: 12px; margin-top: 4px; opacity: 0.7; }
        .delete-btn:hover { opacity: 1; }

        /* Input Area */
        .chat-input { padding: 12px; background: white; display: flex; gap: 8px; border-top: 1px solid #ddd; align-items: center; }
        .chat-input input { flex: 1; border: 1px solid #ccc; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-input button { background: #0088ff; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        /* Modal cài đặt profile */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 300px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; }
        .modal-content button { background: #0088ff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="user-profile" onclick="openProfileModal()">
            <img id="header-avatar" class="user-avatar" src="" alt="Avatar">
            <div class="user-info">
                <span id="header-name" class="user-name">Đang tải...</span>
                <span id="header-badge" class="admin-badge" style="display:none;">QUẢN TRỊ VIÊN</span>
            </div>
        </div>
        <small style="font-size:11px;">Nhấp để đổi Profile</small>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <div class="chat-input">
        <input type="text" id="msg-input" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<!-- Modal cập nhật Profile -->
<div class="modal" id="profile-modal">
    <div class="modal-content">
        <h3>Cập nhật thông tin</h3>
        <label>Tên hiển thị:</label>
        <input type="text" id="input-name" placeholder="Tên của bạn...">
        <label>URL Ảnh đại diện:</label>
        <input type="text" id="input-avatar" placeholder="https://link-anh.com/image.jpg">
        <button onclick="saveProfile()">Lưu lại</button>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // 1. CẤU HÌNH FIREBASE REALTIME DATABASE
    // Hãy thay thế bằng Config từ Firebase Console của bạn để chạy toàn cầu!
    const firebaseConfig = {
        databaseURL: "https://YOUR_DATABASE_NAME.firebaseio.com" 
    };
    
    // Khởi tạo Firebase (chỉ khởi tạo nếu chưa có)
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. TẢI HOẶC KHỞI TẠO ĐỊNH DANH NGƯỜI DÙNG LƯU TRÊN MÁY (LOCALSTORAGE)
    let currentUser = {
        name: localStorage.getItem('chat_name') || 'Người dùng_' + Math.floor(Math.random() * 1000),
        avatar: localStorage.getItem('chat_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + Math.random()
    };

    function updateHeaderUI() {
        document.getElementById('header-name').innerText = currentUser.name;
        document.getElementById('header-avatar').src = currentUser.avatar;
        
        const badge = document.getElementById('header-badge');
        if (currentUser.name.trim() === 'PHUCRAM') {
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }
    }
    updateHeaderUI();

    // 3. XỬ LÝ PROFILE (TÊN & AVATAR)
    function openProfileModal() {
        document.getElementById('input-name').value = currentUser.name;
        document.getElementById('input-avatar').value = currentUser.avatar;
        document.getElementById('profile-modal').style.display = 'flex';
    }

    function saveProfile() {
        const newName = document.getElementById('input-name').value.trim();
        const newAvatar = document.getElementById('input-avatar').value.trim();

        if (newName) currentUser.name = newName;
        if (newAvatar) currentUser.avatar = newAvatar;

        localStorage.setItem('chat_name', currentUser.name);
        localStorage.setItem('chat_avatar', currentUser.avatar);

        updateHeaderUI();
        document.getElementById('profile-modal').style.display = 'none';
    }

    // 4. GỬI TIN NHẮN
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        const messageData = {
            sender: currentUser.name,
            avatar: currentUser.avatar,
            text: text,
            timestamp: Date.now()
        };

        db.ref('messages').push(messageData);
        input.value = '';
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // 5. XÓA TIN NHẮN (CHỈ DÀNH CHO ADMIN "PHUCRAM")
    function deleteMessage(key) {
        if (currentUser.name.trim() === 'PHUCRAM') {
            if (confirm('Bạn có chắc chắn muốn xóa tin nhắn này?')) {
                db.ref('messages/' + key).remove();
            }
        }
    }

    // 6. LẮNG NGHE TIN NHẮN THỜI GIAN THỰC TỪ FIREBASE
    const messagesRef = db.ref('messages');
    messagesRef.on('value', (snapshot) => {
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        
        const data = snapshot.val();
        if (!data) return;

        const isAdmin = (currentUser.name.trim() === 'PHUCRAM');

        Object.keys(data).forEach((key) => {
            const msg = data[key];
            const isMe = (msg.sender === currentUser.name);
            
            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgRow = document.createElement('div');
            msgRow.className = `msg-row ${isMe ? 'my-msg' : ''}`;

            msgRow.innerHTML = `
                <img class="msg-avatar" src="${msg.avatar}" alt="Avatar">
                <div class="msg-content">
                    <div class="msg-sender">${msg.sender}</div>
                    <div class="msg-bubble">
                        ${msg.text}
                    </div>
                    <div class="msg-time">${timeStr}</div>
                    ${isAdmin ? `<button class="delete-btn" onclick="deleteMessage('${key}')">Xóa</button>` : ''}
                </div>
            `;

            container.appendChild(msgRow);
        });

        // Tự động cuộn xuống tin nhắn mới nhất
        container.scrollTop = container.scrollHeight;
    });
</script>
</body>
</html>
