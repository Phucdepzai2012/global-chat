<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL CHAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #d6e2e9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container { width: 100%; max-width: 480px; height: 100vh; max-height: 750px; background: #ebf0f4; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
        
        /* Header */
        .chat-header { background: #0088ff; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0077e6; }
        .group-title { font-size: 18px; font-weight: bold; }
        .admin-status { background: #ff4d4f; color: white; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

        /* Profile Bar */
        .profile-bar { background: #fff; padding: 10px 12px; border-bottom: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 8px; }
        .profile-row { display: flex; gap: 8px; align-items: center; }
        .profile-bar input[type="text"] { flex: 1; border: 1px solid #ccc; padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none; }
        .avatar-preview { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid #ccc; }
        .file-label { background: #f0f2f5; border: 1px solid #ccc; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; color: #333; font-weight: 500; }
        .save-btn { background: #0088ff; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        /* Messages Area */
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #eef2f5; }
        .msg-row { display: flex; gap: 8px; align-items: flex-start; max-width: 85%; }
        .msg-row.my-msg { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #bbb; flex-shrink: 0; }
        
        .msg-content { display: flex; flex-direction: column; }
        .msg-sender { font-size: 11px; color: #555; margin-bottom: 2px; margin-left: 2px; font-weight: 600; }
        .my-msg .msg-sender { text-align: right; margin-right: 2px; }
        
        .msg-bubble { padding: 9px 13px; border-radius: 12px; font-size: 14px; word-break: break-word; background: white; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .my-msg .msg-bubble { background: #e5efff; color: #000; border: 1px solid #cce0ff; }
        
        .chat-media-img { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 5px; display: block; cursor: pointer; }
        .chat-media-video { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 5px; display: block; }

        .msg-footer { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
        .msg-time { font-size: 10px; color: #888; }
        .my-msg .msg-footer { justify-content: flex-end; }

        .delete-btn { background: none; border: none; color: #ff4d4f; cursor: pointer; font-size: 11px; font-weight: bold; }

        /* Input Area */
        .chat-input { padding: 10px; background: white; display: flex; gap: 8px; border-top: 1px solid #e0e0e0; align-items: center; }
        .chat-input input[type="text"] { flex: 1; border: 1px solid #ccc; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 14px; }
        .media-upload-btn { background: #e4e6eb; border: none; padding: 8px 12px; border-radius: 50%; cursor: pointer; font-size: 16px; }
        .chat-input button.send-btn { background: #0088ff; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        .status-loading { font-size: 11px; color: #0088ff; font-weight: bold; text-align: center; display: none; padding: 6px; background: #e5efff; border-bottom: 1px solid #cce0ff; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="group-title">GLOBAL CHAT</div>
        <div id="admin-tag" class="admin-status" style="display: none;">QUẢN TRỊ VIÊN</div>
    </div>

    <!-- Profile Bar -->
    <div class="profile-bar">
        <div class="profile-row">
            <img id="current-avatar-preview" class="avatar-preview" src="" alt="Avatar">
            <input type="text" id="user-name-input" placeholder="Nhập tên riêng của bạn...">
        </div>
        <div class="profile-row" style="justify-content: space-between;">
            <label class="file-label">
                📷 Chọn ảnh đại diện từ máy
                <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
            </label>
            <button class="save-btn" id="save-profile-btn">Lưu Thông Tin</button>
        </div>
    </div>

    <div id="loading-bar" class="status-loading">🚀 Đang tải file lên GitHub Server...</div>

    <!-- Messages Area -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- Input Bar -->
    <div class="chat-input">
        <label class="media-upload-btn" title="Gửi Ảnh/Video">
            📎
            <input type="file" id="media-file-input" accept="image/*,video/*" style="display: none;">
        </label>
        <input type="text" id="msg-input" placeholder="Nhập tin nhắn...">
        <button class="send-btn" id="send-btn">Gửi</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔴 TOKEN GITHUB CỦA BẠN ĐÃ ĐƯỢC ĐIỀN VÀO ĐÂY:
    const GITHUB_CONFIG = {
        token: "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", 
        owner: "TÊN_TÀI_KHOẢN_GITHUB_CỦA_BẠN", // Sửa tên tài khoản GitHub của bạn ở đây
        repo: "TÊN_REPOSITORY_CỦA_BẠN",             // Sửa tên Kho chứa (Repo) của bạn ở đây
        branch: "main"
    };

    const firebaseConfig = {
        apiKey: "AIzaSyCDQsJ_NrGK5ouRLS7vFr55OBZQ0nKhHSk",
        authDomain: "vietnam-life-game.firebaseapp.com",
        databaseURL: "https://vietnam-life-game-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "vietnam-life-game",
        storageBucket: "vietnam-life-game.firebasestorage.app",
        messagingSenderId: "134954120781",
        appId: "1:134954120781:web:d7f762adb80bfce3140e04",
        measurementId: "G-39VPPE1F9T"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const randomId = Math.floor(1000 + Math.random() * 9000);
    const defaultAvatar = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + randomId;

    let currentUser = {
        name: localStorage.getItem('chat_name') || ('Thành viên #' + randomId),
        avatar: localStorage.getItem('chat_avatar') || defaultAvatar
    };

    let tempAvatarBase64 = currentUser.avatar;

    document.getElementById('user-name-input').value = currentUser.name;
    document.getElementById('current-avatar-preview').src = currentUser.avatar;

    function checkAdminStatus() {
        const adminTag = document.getElementById('admin-tag');
        if (currentUser.name.trim() === 'PHUCRAM') {
            adminTag.style.display = 'block';
        } else {
            adminTag.style.display = 'none';
        }
    }
    checkAdminStatus();

    document.getElementById('avatar-file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            tempAvatarBase64 = event.target.result;
            document.getElementById('current-avatar-preview').src = tempAvatarBase64;
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('save-profile-btn').addEventListener('click', () => {
        const inputName = document.getElementById('user-name-input').value.trim();
        if (inputName) currentUser.name = inputName;
        currentUser.avatar = tempAvatarBase64;

        localStorage.setItem('chat_name', currentUser.name);
        localStorage.setItem('chat_avatar', currentUser.avatar);

        checkAdminStatus();
        alert('Đã lưu thông tin!');
        location.reload();
    });

    // TẢI FILE TRỰC TIẾP LÊN SERVER GITHUB
    async function uploadFileToGitHub(file) {
        const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
        const path = `uploads/${fileName}`;
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`;

        const base64Content = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result.split(',')[1]);
            reader.readAsDataURL(file);
        });

        const response = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_CONFIG.token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: `Upload media from chat: ${fileName}`,
                content: base64Content,
                branch: GITHUB_CONFIG.branch
            })
        });

        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.message || 'Lỗi kết nối GitHub API. Hãy kiểm tra lại Tên tài khoản và Tên Repo!');
        }

        // Dùng CDN jsDelivr để load video/ảnh cực nhanh cho mọi người
        return `https://cdn.jsdelivr.net/gh/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}@${GITHUB_CONFIG.branch}/${path}`;
    }

    // GỬI TIN NHẮN
    function sendMessage(mediaUrl = null, mediaType = null) {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text && !mediaUrl) return;

        const messageData = {
            sender: currentUser.name,
            avatar: currentUser.avatar,
            text: text,
            mediaUrl: mediaUrl || null,
            mediaType: mediaType || null,
            timestamp: Date.now()
        };

        push(ref(db, 'global_chat_messages'), messageData)
            .then(() => {
                input.value = '';
            })
            .catch((err) => {
                alert('Lỗi gửi tin nhắn: ' + err.message);
            });
    }

    document.getElementById('send-btn').addEventListener('click', () => sendMessage());
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('media-file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const loadingBar = document.getElementById('loading-bar');
        loadingBar.style.display = 'block';

        try {
            const fileUrl = await uploadFileToGitHub(file);
            const isVideo = file.type.startsWith('video');
            sendMessage(fileUrl, isVideo ? 'video' : 'image');
        } catch (err) {
            alert('Lỗi Upload: ' + err.message);
        } finally {
            loadingBar.style.display = 'none';
            e.target.value = '';
        }
    });

    window.deleteMessage = function(key) {
        if (currentUser.name.trim() === 'PHUCRAM') {
            if (confirm('Xác nhận xóa tin nhắn này?')) {
                remove(ref(db, 'global_chat_messages/' + key));
            }
        }
    };

    // ĐỒNG BỘ TIN NHẮN THỜI GIAN THỰC ĐẾN MỌI THIẾT BỊ
    onValue(ref(db, 'global_chat_messages'), (snapshot) => {
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        
        const data = snapshot.val();
        if (!data) return;

        const isAdmin = (currentUser.name.trim() === 'PHUCRAM');

        Object.keys(data).forEach((key) => {
            const msg = data[key];
            const isMe = (msg.sender === currentUser.name);
            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgRow = document.createElement('div');
            msgRow.className = `msg-row ${isMe ? 'my-msg' : ''}`;

            let mediaHTML = '';
            if (msg.mediaUrl) {
                if (msg.mediaType === 'image') {
                    mediaHTML = `<img src="${msg.mediaUrl}" class="chat-media-img" onclick="window.open('${msg.mediaUrl}', '_blank')">`;
                } else if (msg.mediaType === 'video') {
                    mediaHTML = `<video src="${msg.mediaUrl}" class="chat-media-video" controls preload="metadata"></video>`;
                }
            }

            msgRow.innerHTML = `
                <img class="msg-avatar" src="${msg.avatar}" alt="Avatar">
                <div class="msg-content">
                    <div class="msg-sender">${escapeHtml(msg.sender)}</div>
                    <div class="msg-bubble">
                        ${msg.text ? escapeHtml(msg.text) : ''}
                        ${mediaHTML}
                    </div>
                    <div class="msg-footer">
                        <span class="msg-time">${timeStr}</span>
                        ${isAdmin ? `<button class="delete-btn" onclick="deleteMessage('${key}')">Xóa</button>` : ''}
                    </div>
                </div>
            `;

            container.appendChild(msgRow);
        });

        container.scrollTop = container.scrollHeight;
    });

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
